<body>
  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">V</div><div><b>VORO</b><small>AI视频制作工作台</small></div><button class="sidebar-close" id="sidebarClose" aria-label="关闭导航">✕</button></div>

        <button class="nav-item active" data-page="projects"><span class="nav-icon">□</span><span>项目管理</span></button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon">✓</span><span>任务与审核</span></button>

        <button class="nav-item" data-page="script"><span class="nav-no">2</span><span>剧本与分镜</span></button>
        <button class="nav-item" data-page="shots"><span class="nav-no">3</span><span>镜头生成</span></button>
        <button class="nav-item" data-page="edit"><span class="nav-no">4</span><span>剪辑与声音</span></button>
        <button class="nav-item" data-page="delivery"><span class="nav-no">5</span><span>审核与交付</span></button>
        <div class="nav-label" style="margin-top:14px">资源中心</div>
        <button class="nav-item" data-page="assets"><span class="nav-icon">▧</span><span>资产中心</span></button>
        <button class="nav-item" data-page="templates"><span class="nav-icon">▦</span><span>模板中心</span></button>
        <button class="nav-item role-admin" data-page="models"><span class="nav-icon">AI</span><span>模型能力与供应商</span></button>
        <div class="nav-label" style="margin-top:14px">企业管理</div>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">↗</span><span>数据分析</span></button>

    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="mobile-menu" id="mobileMenu" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>

        </div>

          <span class="save-state saved" id="saveState" aria-live="polite">已保存到本机</span>
          <select class="role-select" id="roleSelect" aria-label="预览权限视图"><option value="member">普通成员</option><option value="projectAdmin">项目管理员</option><option value="enterpriseAdmin" selected>企业管理员</option></select>
          <button class="project-select" data-action="go-projects"><i></i><b id="projectNameTop">未选择项目</b></button>
          <button class="btn btn-primary btn-sm" data-action="new-project">＋ 新建项目</button>
        </div>
      </header>
      <div class="content"><div class="page" id="page"></div></div>
    </main>
  </div>
  <div class="sidebar-mask" id="sidebarMask" aria-hidden="true"></div>

  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-describedby="drawerSubtitle" aria-hidden="true" tabindex="-1" hidden>
    <div class="drawer-head"><div><h2 id="drawerTitle">功能配置</h2><p id="drawerSubtitle">配置仅作用于当前项目</p></div><button class="drawer-close" data-action="close-drawer" aria-label="关闭">✕</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot"><span style="color:var(--text-3);font-size:11px" id="drawerHint">所有设置均可再次修改</span><div class="drawer-foot-right"><button class="btn btn-ghost" data-action="close-drawer">取消</button><button class="btn btn-primary" id="drawerPrimary" data-action="save-panel">保存设置</button></div></div>
  </aside>
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script type="application/x-voro-legacy">
    const STAGES=[
      {key:'plan',no:1,name:'创意计划',desc:'明确目标、输入、约束和生成计划'},
      {key:'script',no:2,name:'剧本与分镜',desc:'组织内容结构并拆解为可编辑镜头'},
      {key:'shots',no:3,name:'镜头生成',desc:'建立一致性规则并逐镜头生成'},
      {key:'edit',no:4,name:'剪辑与声音',desc:'完成时间线、旁白、音乐、音效和字幕'},
      {key:'delivery',no:5,name:'审核与交付',desc:'质量检查、审批、导出和发布'}
    ];
    const PAGE_NAMES={dashboard:'工作台总览',projects:'项目管理',tasks:'任务与审核',assets:'项目资产库',templates:'模板中心',models:'模型能力与供应商',analytics:'数据分析',cost:'成本与配额',team:'团队与权限',audit:'审计日志',settings:'系统设置'};
    const state={page:'projects',projectName:'',uploadCounts:{},drawerType:'',drawerStage:'',createdScenes:0,createdShots:0};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function stageStrip(){return `<div class="stage-strip">${STAGES.map(s=>`<button class="stage-chip ${state.page===s.key?'active':''}" data-page="${s.key}"><em>${s.no}</em><span>${s.name}</span></button>`).join('')}</div>`}
    function projectTools(){return `<div class="project-tools"><div class="project-tools-left"><span class="context-mark">AI</span><div class="context-copy"><b>${state.projectName?esc(state.projectName):'未选择项目'}</b><small>项目级上下文、锁定内容和版本关系持续生效</small></div></div><div class="tool-links"><button class="tool-link" data-panel="requirement">项目需求</button><button class="tool-link" data-panel="materials">素材库</button><button class="tool-link" data-panel="visual">全局视觉规则</button><button class="tool-link" data-panel="model">项目AI与预算</button><button class="tool-link" data-panel="history">版本历史</button></div></div>`}
    function stageHead(stage,actions=''){return `${projectTools()}${stageStrip()}<div class="page-head"><div><div class="page-title">${stage.no}. ${stage.name}</div><div class="page-desc">${stage.desc}。各成果物均可编辑、锁定版本，并针对局部内容继续调用AI。</div></div><div class="page-actions">${actions}<button class="btn btn-primary" data-panel="model" data-stage="${stage.key}">配置本阶段AI</button></div></div>`}
    function empty(icon,title,desc,buttons=''){return `<div class="empty"><div class="empty-icon">${icon}</div><b>${title}</b><p>${desc}</p>${buttons?`<div class="empty-actions">${buttons}</div>`:''}</div>`}
    function nextButton(key){const i=STAGES.findIndex(s=>s.key===key);if(i<0||i===STAGES.length-1)return '';return `<button class="btn" data-page="${STAGES[i+1].key}">下一阶段：${STAGES[i+1].name}</button>`}
    function enterpriseHead(title,desc,actions=''){return `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-desc">${desc}</div></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
    function metricCards(items){return `<div class="metric-row">${items.map(x=>`<div class="metric-card"><span>${x[0]}</span><b class="metric-empty">—</b><small>${x[1]}</small></div>`).join('')}</div>`}
    function emptyTable(columns,title,desc,buttons=''){return `<div class="table-shell"><table class="data-table"><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody><tr class="data-table-empty"><td colspan="${columns.length}"><div class="table-empty"><b>${title}</b><p>${desc}</p>${buttons?`<div class="empty-actions">${buttons}</div>`:''}</div></td></tr></tbody></table></div>`}
    function pageTabs(items,active=0){return `<div class="page-tabs">${items.map((x,i)=>`<button class="${i===active?'active':''}" data-seg>${x}</button>`).join('')}</div>`}
    function moduleCard(icon,title,desc,action,panel){return `<div class="module-card"><div class="module-card-head"><div class="module-icon">${icon}</div><span class="capability-state">尚未配置</span></div><h3 style="margin-top:12px">${title}</h3><p>${desc}</p><button class="btn btn-sm" data-panel="${panel}">${action}</button></div>`}

    function projectsPage(){return `${enterpriseHead('项目管理','创建、导入、查找并管理企业视频项目；选择项目后进入五阶段AI制作流程。','<button class="btn" data-panel="import">导入项目需求</button><button class="btn btn-primary" data-action="new-project">＋ 创建空白项目</button>')}
      <div class="filterbar"><div class="filterbar-left"><input class="search-input" placeholder="搜索项目名称或标识"><select class="select" style="width:auto"><option>全部状态</option><option>制作中</option><option>待审核</option><option>已交付</option></select><select class="select" style="width:auto"><option>全部阶段</option>${STAGES.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="filterbar-right"><button class="btn btn-sm active" data-seg>列表</button><button class="btn btn-sm" data-seg>看板</button><button class="btn btn-sm" data-action="disabled-bulk">批量操作</button></div></div>
      ${emptyTable(['项目','当前阶段','负责人','输出规格','状态','更新时间','操作'],'暂无项目','创建空白项目或导入已有需求后，项目会显示在这里。','<button class="btn" data-panel="import">导入需求</button><button class="btn btn-primary" data-action="new-project">创建第一个项目</button>')}
      <section class="card" style="margin-top:14px"><div class="card-head"><div><h3>标准AI制作流程</h3><p>项目上下文、素材、模型路由、版本关系和审核状态贯穿全部阶段</p></div></div><div class="card-body"><div class="grid-3">${STAGES.map(s=>`<button class="rule-slot" style="text-align:left;color:inherit" data-page="${s.key}"><b>${s.no}. ${s.name}</b><span>${s.desc}</span><em style="color:var(--blue-2);font-style:normal;font-size:11px">查看功能 →</em></button>`).join('')}</div></div></section>`}

    function openDrawer(type,stage='',target=''){state.drawerType=type;state.drawerStage=stage||state.page;let body='';
      if(type==='new-project'){body=`<div class="drawer-section"><h3>项目基本信息</h3><p>只创建空白项目，不带入任何样例数据。</p><div class="form-group"><label class="form-label">项目名称</label><input class="input" id="newProjectName" placeholder="填写项目名称"></div><div class="form-group" style="margin-top:12px"><label class="form-label">原始需求</label><textarea class="textarea" id="newProjectBrief" placeholder="可先留空，进入创意计划后再完善"></textarea></div></div><div class="drawer-section"><h3>初始输出规格</h3><p>后续可在项目需求中修改。</p><div class="form-grid"><div class="form-group"><label class="form-label">目标时长</label><input class="input" type="number" min="1" placeholder="填写秒数"></div><div class="form-group"><label class="form-label">主画幅</label><select class="select"><option value="" selected>请选择</option><option>横屏</option><option>竖屏</option><option>方形</option><option>自定义</option></select></div></div></div>`;return drawerShell('创建空白项目','创建后进入创意计划',''+body,'创建并进入','不会自动生成或填充内容');}

      const onboarding=!state.projects.length?`<div class="onboarding"><div class="onboarding-step"><em>1</em><b>创建或导入项目</b><p>先建立项目，所有生成成果和版本都归档到项目。</p><button class="btn btn-primary btn-sm" data-action="new-project">创建项目</button></div><div class="onboarding-step"><em>2</em><b>准备素材与AI能力</b><p>按项目或企业范围管理素材、模型和路由。</p><button class="btn btn-sm" data-page="assets">打开资产中心</button></div><div class="onboarding-step"><em>3</em><b>进入五阶段制作</b><p>从需求计划开始，逐步完成生成、剪辑和交付。</p><button class="btn btn-sm" data-page="plan">进入创意计划</button></div></div>`:`<div class="grid-2"><div class="card"><div class="card-head"><h3>当前项目进度</h3></div><div class="card-body">${p?stageStrip():emptyState('选择一个项目','从项目管理选择后查看完整进度。','<button class="btn btn-sm" data-page="projects">选择项目</button>')}</div></div><div class="card"><div class="card-head"><h3>最近操作</h3></div><div class="card-body">${state.audit.length?state.audit.slice(0,6).map(a=>`<div class="setting-row"><div><b>${esc(a.action)}</b><small>${new Date(a.at).toLocaleString('zh-CN')}</small></div><button class="btn btn-xs" data-page="${a.page}">打开</button></div>`).join(''):emptyState('尚无操作记录','创建项目或编辑成果后，这里会显示最近活动。')}</div></div></div>`;
      return `${scopeBar()}${pageHead('工作台总览','从项目、任务和审核状态快速进入下一步工作。','<button class="btn btn-primary" data-action="new-project">＋ 新建项目</button>')}<div class="metric-row"><div class="metric-card"><span>项目总数</span><b>${state.projects.length}</b><small>当前浏览器中的项目</small></div><div class="metric-card"><span>进行中任务</span><b>${openTasks}</b><small>含人工任务与审核</small></div><div class="metric-card"><span>待审核</span><b>${pending}</b><small>等待处理的审核版本</small></div><div class="metric-card"><span>已交付</span><b>${state.projects.filter(x=>x.status==='delivered').length}</b><small>已导出交付包</small></div></div>${onboarding}`
    }

    function projectsPage(){
      const rows=state.projects.map(p=>`<tr><td><b>${esc(p.name)}</b>${p.id===state.currentProjectId?' '+statusPill('ready'):''}</td><td>${esc(p.source==='import'?'导入需求':p.source==='template'?'模板创建':'空白创建')}</td><td>${esc(PAGE_NAMES[p.currentStage]||'创意计划')}</td><td>${statusPill(p.status==='approved'?'approved':p.status==='review'?'in_review':'draft')}</td><td>${new Date(p.updatedAt).toLocaleString('zh-CN')}</td><td><button class="btn btn-xs" data-action="select-project" data-id="${p.id}">${p.id===state.currentProjectId?'继续':'选择'}</button></td></tr>`).join('');
      const cards=state.projects.map(p=>`<article class="project-card ${p.id===state.currentProjectId?'selected':''}"><div class="artifact-head"><h3>${esc(p.name)}</h3>${statusPill(p.stageStatus[p.currentStage])}</div><p>${esc(p.brief||'尚未填写项目需求')}</p><div class="project-meta"><span class="status-pill">${esc(PAGE_NAMES[p.currentStage])}</span><span class="status-pill">${p.shots.length} 个镜头</span></div><button class="btn btn-sm" data-action="select-project" data-id="${p.id}">${p.id===state.currentProjectId?'继续制作':'选择项目'}</button></article>`).join('');
      return `${scopeBar()}${pageHead('项目管理','先选择项目，再进入五阶段制作；项目内容会自动保存在当前浏览器。','<button class="btn" data-panel="import-project">导入项目需求</button><button class="btn" data-panel="project-from-template">从模板创建</button><button class="btn btn-primary" data-action="new-project">＋ 创建空白项目</button>')}<div class="filterbar"><div class="filterbar-left"><button class="btn btn-sm ${state.ui.projectView==='list'?'active':''}" data-action="project-view" data-value="list" aria-pressed="${state.ui.projectView==='list'}">列表</button><button class="btn btn-sm ${state.ui.projectView==='board'?'active':''}" data-action="project-view" data-value="board" aria-pressed="${state.ui.projectView==='board'}">看板</button></div><div class="filterbar-right"><span class="permission-note">项目未选时，阶段操作会先引导选择或创建项目。</span></div></div>${state.ui.projectView==='board'?`<div class="project-card-grid">${cards||emptyState('还没有项目','从空白、需求文件或模板创建第一个项目。','<button class="btn btn-primary" data-action="new-project">创建项目</button>')}</div>`:`<div class="table-shell"><table class="data-table"><thead><tr><th>项目</th><th>来源</th><th>当前阶段</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows||tableEmpty('还没有项目','创建项目后，所有阶段成果、任务和资产会在这里汇总。','<button class="btn btn-primary" data-action="new-project">创建项目</button>')}</tbody></table></div>`}`
    }

    function tasksPage(){
      let tasks=[...state.tasks];if(state.ui.taskTab==='mine')tasks=tasks.filter(t=>t.assignee==='current-user');if(state.ui.taskTab==='review')tasks=tasks.filter(t=>t.kind==='review');if(state.ui.taskTab==='created')tasks=tasks.filter(t=>t.creator==='current-user');
      const rows=tasks.map(t=>{const p=state.projects.find(x=>x.id===t.projectId);return `<tr><td><b>${esc(t.title)}</b><br><small>${t.kind==='review'?'审核任务':'协作任务'}</small></td><td>${esc(p?.name||'未关联')}</td><td>${esc(t.stageKey?PAGE_NAMES[t.stageKey]:'项目级')}</td><td>${statusPill(t.status==='pending_review'?'in_review':t.status==='approved'?'approved':'draft')}</td><td>${esc(t.priority||'中')}</td><td><button class="btn btn-xs" data-action="open-task" data-id="${t.id}">打开</button>${t.kind==='review'&&t.status==='pending_review'?` <button class="btn btn-xs" data-action="review-approve" data-id="${t.id}">通过</button> <button class="btn btn-xs btn-danger" data-action="review-return" data-id="${t.id}">退回</button>`:''}</td></tr>`}).join('');
      return `${scopeBar()}${pageHead('任务与审核','人工任务、审核版本和项目阶段保持联动。','<button class="btn btn-primary" data-panel="new-task">＋ 新建任务</button>')}<div class="page-tabs"><button class="${state.ui.taskTab==='mine'?'active':''}" data-action="task-tab" data-value="mine" aria-pressed="${state.ui.taskTab==='mine'}">我的任务</button><button class="${state.ui.taskTab==='review'?'active':''}" data-action="task-tab" data-value="review" aria-pressed="${state.ui.taskTab==='review'}">待我审核</button><button class="${state.ui.taskTab==='created'?'active':''}" data-action="task-tab" data-value="created" aria-pressed="${state.ui.taskTab==='created'}">我发起的</button></div><div class="table-shell" style="border-top-left-radius:0;border-top-right-radius:0"><table class="data-table"><thead><tr><th>任务</th><th>项目</th><th>关联阶段</th><th>状态</th><th>优先级</th><th>操作</th></tr></thead><tbody>${rows||tableEmpty('当前没有任务','新建任务，或从交付阶段提交审核。','<button class="btn btn-primary" data-panel="new-task">新建任务</button>')}</tbody></table></div>`
    }

    function planPage(){
      const p=currentProject();if(!p)return `${pageHead('创意计划','先选择项目，再填写需求并生成计划。')} ${emptyState('尚未选择项目','选择或创建项目后，AI成果才会归档到正确项目。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;
      const dirs=p.plan.directions.map((d,i)=>`<article class="artifact ${p.plan.selected===d.id?'selected':''}"><div class="artifact-head"><div><h4>${esc(d.title)}</h4><p>AI生成 · V${d.version}${d.humanEdited?' · 人工已编辑':''}</p></div>${p.plan.selected===d.id?statusPill('ready'):statusPill('draft')}</div><div class="form-group"><label class="form-label">创作主张</label><textarea class="textarea" data-direction-field="summary" data-id="${d.id}">${esc(d.summary)}</textarea></div><div class="form-grid" style="margin-top:9px"><div class="form-group"><label class="form-label">内容结构</label><textarea class="textarea" data-direction-field="structure" data-id="${d.id}">${esc(d.structure)}</textarea></div><div class="form-group"><label class="form-label">时长与节奏</label><textarea class="textarea" data-direction-field="rhythm" data-id="${d.id}">${esc(d.rhythm)}</textarea></div></div><div class="artifact-actions" style="margin-top:10px"><button class="btn btn-xs" data-action="select-direction" data-id="${d.id}">${p.plan.selected===d.id?'已采用':'采用此候选'}</button><button class="btn btn-xs" data-action="ai-refine-plan" data-id="${d.id}">AI局部优化</button><button class="btn btn-xs" data-action="duplicate-direction" data-id="${d.id}">保存为新版本</button></div></article>`).join('');
      const locked=p.plan.baselineLocked;
      return stageShell('创意计划','将原始需求转化为可编辑、可选择和可锁定的项目计划。',`<button class="btn" data-action="save-requirements">保存需求</button>${jobButton(`plan:${p.id}`,'AI生成计划','ai-plan',!p.brief.trim())}<button class="btn btn-primary" data-page="script" ${!locked?'disabled title="需先锁定计划基线"':''}>进入剧本与分镜</button>`,`<div class="stage-alert ${locked?'success':''}"><div><b>${locked?'计划基线已锁定':'当前为需求草稿'}</b><p>${locked?'下游已可引用当前计划；解锁修改会把下游标记为需更新。':'填写并保存需求，生成候选后采用并锁定。'}</p></div>${locked?'<button class="btn btn-sm" data-action="unlock-plan">解锁并创建新版本</button>':''}</div><div class="grid-2-1"><div class="stack"><section class="card"><div class="card-head"><div><h3>项目需求</h3><p>所有字段自动保存在本机，可随时返回继续。</p></div>${statusPill(p.plan.parsed?'ready':'draft')}</div><div class="card-body"><div class="form-grid"><div class="form-group full"><label class="form-label">原始需求 <span class="required">*</span></label><textarea class="textarea" data-project-field="brief" placeholder="说明要制作什么、给谁看、希望达到什么效果">${esc(p.brief)}</textarea></div><div class="form-group"><label class="form-label">目标受众</label><input class="input" data-project-field="audience" value="${esc(p.audience)}" placeholder="例如：内部评审、公开传播"></div><div class="form-group"><label class="form-label">使用场景</label><input class="input" data-project-field="useCase" value="${esc(p.useCase)}" placeholder="说明发布渠道或播放环境"></div><div class="form-group"><label class="form-label">目标时长（秒）</label><input class="input" type="number" min="1" data-project-field="duration" value="${esc(p.duration)}" placeholder="未设定"></div><div class="form-group"><label class="form-label">主画幅</label><select class="select" data-project-field="ratio"><option value="16:9" ${p.ratio==='16:9'?'selected':''}>16:9 横屏</option><option value="9:16" ${p.ratio==='9:16'?'selected':''}>9:16 竖屏</option><option value="1:1" ${p.ratio==='1:1'?'selected':''}>1:1 方形</option></select></div><div class="form-group full"><label class="form-label">必须项、禁止项与约束</label><textarea class="textarea" data-project-field="constraints" placeholder="可填写必须出现、不能出现、事实依据、版权要求等">${esc(p.constraints)}</textarea></div></div></div></section><section class="card"><div class="card-head"><div><h3>AI计划候选</h3><p>每次生成或局部优化都会保留独立版本。</p></div>${p.plan.directions.length?`<span>${p.plan.directions.length} 个候选</span>`:''}</div><div class="card-body">${dirs||emptyState('尚未生成计划候选','保存需求后点击“AI生成计划”，系统会创建可编辑候选。')}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><h3>当前计划基线</h3></div><div class="card-body">${p.plan.selected?`<div class="artifact selected"><div class="artifact-head"><h4>${esc(p.plan.directions.find(d=>d.id===p.plan.selected)?.title||'已选候选')}</h4>${statusPill(locked?'locked':'ready')}</div><p>版本 V${p.plan.version||1} · ${locked?'下游可引用':'等待锁定'}</p>${locked?'':'<button class="btn btn-primary btn-sm" data-action="lock-plan">设为计划基线并锁定</button>'}</div>`:emptyState('尚未采用候选','先从左侧选择一个候选。')}</div></section><section class="card"><div class="card-head"><h3>输出与轨道要求</h3></div><div class="card-body">${['narration:旁白','music:音乐','sfx:音效','subtitles:字幕'].map(x=>{const [k,n]=x.split(':');return `<div class="setting-row"><div><b>${n}</b><small>纳入成片检查与交付清单</small></div><button class="switch ${p.requiredTracks[k]?'on':''}" role="switch" aria-checked="${p.requiredTracks[k]}" aria-label="是否需要${n}" data-action="toggle-track" data-key="${k}"></button></div>`}).join('')}</div></section></aside></div>`)
    }

    function sceneTree(p){
      if(!p.scenes.length)return `<div class="tree-empty"><b>还没有场景</b><span>添加场景后，再在场景内追加镜头。</span></div>`;
      return `<div class="tree-list">${p.scenes.map((s,si)=>`<button class="tree-item ${state.ui.selectedSceneId===s.id&&!state.ui.selectedShotId?'selected':''}" data-action="select-scene" data-id="${s.id}"><b>S${String(si+1).padStart(2,'0')} · ${esc(s.name)}</b><small>${p.shots.filter(x=>x.sceneId===s.id).length} 个镜头 · ${s.locked?'已锁定':'草稿'}</small></button>${p.shots.filter(x=>x.sceneId===s.id).map((sh,shi)=>`<button class="tree-item ${state.ui.selectedShotId===sh.id?'selected':''}" data-action="select-shot" data-id="${sh.id}" style="margin-left:16px"><b>S${String(si+1).padStart(2,'0')}-${String(shi+1).padStart(2,'0')} · ${esc(sh.name)}</b><small>${esc(sh.duration||'未设时长')}秒 · ${sh.locked?'已锁定':'可编辑'}</small></button>`).join('')}`).join('')}</div>`
    }
    function scriptEditor(p){
      const shot=p.shots.find(x=>x.id===state.ui.selectedShotId), scene=p.scenes.find(x=>x.id===state.ui.selectedSceneId);
      if(shot)return `<div class="form-grid"><div class="form-group"><label class="form-label">镜头名称</label><input class="input" data-shot-field="name" data-id="${shot.id}" value="${esc(shot.name)}"></div><div class="form-group"><label class="form-label">目标时长（秒）</label><input class="input" type="number" min="0.5" step="0.5" data-shot-field="duration" data-id="${shot.id}" value="${esc(shot.duration)}"></div><div class="form-group full"><label class="form-label">画面描述 <span class="required">*</span></label><textarea class="textarea" data-shot-field="visual" data-id="${shot.id}" placeholder="描述主体、环境、动作、光线和镜头运动">${esc(shot.visual)}</textarea></div><div class="form-group"><label class="form-label">景别</label><input class="input" data-shot-field="shotSize" data-id="${shot.id}" value="${esc(shot.shotSize)}" placeholder="远景、中景、近景等"></div><div class="form-group"><label class="form-label">机位与运动</label><input class="input" data-shot-field="camera" data-id="${shot.id}" value="${esc(shot.camera)}" placeholder="固定、跟拍、推拉摇移等"></div><div class="form-group"><label class="form-label">旁白</label><textarea class="textarea" data-shot-field="narration" data-id="${shot.id}">${esc(shot.narration)}</textarea></div><div class="form-group"><label class="form-label">画面文字</label><textarea class="textarea" data-shot-field="screenText" data-id="${shot.id}">${esc(shot.screenText)}</textarea></div><div class="form-group full"><label class="form-label">验收标准</label><textarea class="textarea" data-shot-field="acceptance" data-id="${shot.id}" placeholder="说明生成结果必须满足什么条件">${esc(shot.acceptance)}</textarea></div></div><div class="artifact-actions" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="ai-expand-selected">AI补全当前镜头</button><button class="btn btn-sm" data-action="duplicate-shot" data-id="${shot.id}">复制镜头</button><button class="btn btn-sm btn-danger" data-action="delete-shot" data-id="${shot.id}">删除</button></div>`;
      if(scene)return `<div class="form-grid"><div class="form-group full"><label class="form-label">场景名称</label><input class="input" data-scene-field="name" data-id="${scene.id}" value="${esc(scene.name)}"></div><div class="form-group full"><label class="form-label">场景任务与内容</label><textarea class="textarea" data-scene-field="description" data-id="${scene.id}" placeholder="说明本场景要表达的内容与叙事作用">${esc(scene.description)}</textarea></div></div><div class="artifact-actions" style="margin-top:12px"><button class="btn btn-primary btn-sm" data-action="ai-expand-selected">AI扩写当前场景</button><button class="btn btn-sm" data-action="add-shot">＋ 在此场景添加镜头</button><button class="btn btn-sm btn-danger" data-action="delete-scene" data-id="${scene.id}">删除场景</button></div>`;
      return emptyState('选择或添加场景','左侧选择场景或镜头后，可在这里直接编辑并使用AI局部补全。','<button class="btn btn-primary" data-action="add-scene">＋ 添加场景</button>')
    }
    function scriptPage(){
      const p=currentProject();if(!p)return `${pageHead('剧本与分镜','先选择项目。')}${emptyState('尚未选择项目','选择项目后再创建场景和镜头。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;
      const locked=p.stageStatus.script==='locked', ready=p.plan.baselineLocked, total=p.shots.reduce((n,s)=>n+(Number(s.duration)||0),0);
      let body='';
      if(state.ui.scriptView==='storyboard')body=p.shots.length?`<div class="shot-card-grid">${p.shots.map((s,i)=>`<article class="shot-card"><div class="shot-frame">镜头 ${i+1} · 等待生成</div><div class="shot-card-body"><div class="artifact-head"><h3>${esc(s.name)}</h3>${statusPill(s.locked?'locked':'draft')}</div><p>${esc(s.visual||'尚未填写画面描述')}</p><button class="btn btn-xs" data-action="select-shot-and-script" data-id="${s.id}">编辑镜头</button></div></article>`).join('')}</div>`:emptyState('还没有镜头','先添加场景，再在场景中追加镜头。','<button class="btn btn-primary" data-action="add-scene">添加场景</button>');
      else if(state.ui.scriptView==='coverage')body=`<div class="table-shell"><table class="data-table"><thead><tr><th>镜头</th><th>画面描述</th><th>时长</th><th>旁白/文字</th><th>验收标准</th><th>状态</th></tr></thead><tbody>${p.shots.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.visual?'完整':'缺失'}</td><td>${s.duration?`${esc(s.duration)}秒`:'缺失'}</td><td>${s.narration||s.screenText?'已填写':'未填写'}</td><td>${s.acceptance?'已填写':'未填写'}</td><td>${statusPill(s.visual&&s.duration?'ready':'blocked')}</td></tr>`).join('')||tableEmpty('还没有镜头','添加镜头后，这里会检查字段完整度。')}</tbody></table></div>`;
      else body=`<div class="workspace"><div class="workspace-col"><div class="workspace-title"><span>场景与镜头树</span><button class="btn btn-xs" data-action="add-scene" ${!ready?'disabled title="需先锁定计划基线"':''}>＋ 场景</button></div><div class="workspace-body">${sceneTree(p)}</div></div><div class="workspace-col"><div class="workspace-title"><span>当前内容编辑</span><span class="save-state saved">自动保存</span></div><div class="workspace-body">${scriptEditor(p)}</div></div><div class="workspace-col"><div class="workspace-title"><span>阶段检查器</span></div><div class="workspace-body"><div class="mini-kpi"><div><b>${p.scenes.length}</b><span>场景</span></div><div><b>${p.shots.length}</b><span>镜头</span></div><div><b>${total.toFixed(1)}s</b><span>总时长</span></div></div><div class="card-note" style="margin-top:12px">确认条件：至少 1 个场景和 1 个镜头；每个镜头必须有画面描述和有效时长。</div><div class="artifact-actions" style="margin-top:12px"><button class="btn btn-sm" data-action="add-shot" ${!state.ui.selectedSceneId?'disabled title="先选择场景"':''}>＋ 镜头</button><button class="btn btn-sm" data-action="ai-generate-structure" ${!ready?'disabled title="需先锁定计划基线"':''}>AI从计划拆解</button></div></div></div></div>`;

    function shotsPage(){
      const p=currentProject();if(!p)return `${pageHead('镜头生成','先选择项目。')}${emptyState('尚未选择项目','选择项目后再生成镜头。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;

      return stageShell('镜头生成','每个规划镜头都可独立调用AI、比较候选、局部重做、采用并锁定。',`<button class="btn" data-action="batch-generate" ${!ready||!p.shots.length?'disabled':''}>批量生成未完成镜头</button><button class="btn btn-primary" data-page="edit" ${!allLocked?'disabled title="需锁定全部纳入成片的镜头"':''}>进入剪辑与声音</button>`,`<div class="stage-alert ${allLocked?'success':''}"><div><b>${!ready?'等待锁定剧本分镜':allLocked?'全部镜头已锁定':'镜头生产进行中'}</b><p>${!ready?'可查看镜头，但生成操作暂不可用。':`已锁定 ${p.shots.filter(s=>s.locked).length}/${p.shots.length} 个镜头；AI结果始终作为新候选，不直接覆盖。`}</p></div><button class="btn btn-sm" data-page="models">配置本阶段AI路由</button></div>${p.shots.length?`<div class="shot-card-grid">${cards}</div>`:emptyState('还没有可生产镜头','先在剧本与分镜阶段添加并锁定镜头表。','<button class="btn btn-primary" data-page="script">返回剧本与分镜</button>')}`)
    }

    function timelineTracks(p){const clips=p.timeline.clips;const clipHtml=clips.map(c=>`<button class="timeline-clip ${state.ui.selectedClipId===c.id?'selected':''}" data-action="select-clip" data-id="${c.id}" style="flex:${Math.max(.6,Number(c.duration)||1)} 0 70px"><span>${esc(c.label)}</span><small>${Number(c.duration).toFixed(1)}s</small></button>`).join('');return `<div class="timeline"><div class="ruler"><span>轨道</span><span>00:00</span><span>00:15</span><span>00:30</span><span>00:45</span><span>01:00</span><span>01:15</span></div><div class="track"><div class="track-name"><i></i>V1 视频</div><div class="track-lane ${clips.length?'has-clips':''}">${clipHtml||'等待建立序列'}</div></div>${[['narration','A1 旁白'],['music','A2 音乐'],['sfx','A3 音效'],['subtitles','T1 字幕']].map(([k,n])=>`<div class="track"><div class="track-name"><i></i>${n}</div><div class="track-lane">${p.timeline.tracks[k]==='ready'?'AI成果已就绪':p.timeline.tracks[k]==='running'?'生成中…':'尚未生成'}</div></div>`).join('')}<div class="timeline-foot"><span>总时长 ${clips.reduce((n,c)=>n+Number(c.duration||0),0).toFixed(1)} 秒</span><span>时间线 V${p.timeline.savedVersion||1} · ${p.timeline.dirty?'未保存':'已保存'}</span></div></div>`}
    function editPage(){
      const p=currentProject();if(!p)return `${pageHead('剪辑与声音','先选择项目。')}${emptyState('尚未选择项目','选择项目后再进行时间线编辑。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;

      return stageShell('剪辑与声音','从已锁定镜头建立序列；分割、删除、撤销和重做都改变真实时间线状态。',`<button class="btn" data-action="auto-sequence" ${!locked.length?'disabled':''}>从锁定镜头建序列</button><button class="btn" data-action="save-timeline" ${!t.clips.length||!t.dirty?'disabled':''}>保存时间线版本</button><button class="btn btn-primary" data-action="render-review" ${!t.savedVersion?'disabled title="需先保存时间线版本"':''}>渲染审核版</button>`,`<div class="stage-alert ${t.savedVersion?'success':''}"><div><b>${t.clips.length?`时间线已有 ${t.clips.length} 个片段`:'等待建立时间线'}</b><p>${t.savedVersion?`已保存 V${t.savedVersion}，可渲染审核版。`:'从已锁定镜头建立序列后，可进行可撤销编辑。'}</p></div></div><div class="grid-2-1"><div class="stack"><section class="card"><div class="card-head"><div><h3>动态预览</h3><p>预览状态与时间线版本保持联动。</p></div>${statusPill(t.previewStatus==='ready'?'ready':'draft')}</div><div class="card-body"><div class="preview"><b>${t.previewStatus==='ready'?'审核版已生成':'当前为时间线代理预览'}</b><span>${t.clips.length?'选择片段后可拆分或局部重剪':'尚无视频片段'}</span><button class="btn btn-sm" data-action="render-review" ${!t.savedVersion?'disabled':''}>生成审核预览</button></div></div></section><section class="card"><div class="timeline-toolbar"><div class="toolbar-group"><button class="btn btn-sm" data-action="undo-timeline" ${!t.history.length?'disabled':''}>↶ 撤销</button><button class="btn btn-sm" data-action="redo-timeline" ${!t.future.length?'disabled':''}>↷ 重做</button><button class="btn btn-sm" data-action="split-clip" ${!selected?'disabled':''}>✂ 分割</button><button class="btn btn-sm btn-danger" data-action="delete-clip" ${!selected?'disabled':''}>删除片段</button></div><span class="save-state ${t.dirty?'':'saved'}">${t.dirty?'有未保存更改':'当前版本已保存'}</span></div><div class="card-body">${timelineTracks(p)}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><h3>片段检查器</h3></div><div class="card-body">${selected?`<div class="form-group"><label class="form-label">片段名称</label><input class="input" data-clip-field="label" data-id="${selected.id}" value="${esc(     }

    function deliveryPage(){
      const p=currentProject();if(!p)return `${pageHead('审核与交付','先选择项目。')}${emptyState('尚未选择项目','选择项目后再进行审核与交付。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;

ton></div></div></section><section class="card span-2"><div class="card-head"><div><h3>质检问题与AI修复</h3><p>AI修复先形成候选，采用后更新对应成果状态。</p></div></div><div class="card-body"><div class="issue-list">${issues||emptyState('当前没有质检问题','运行AI质检后，这里会显示基于项目状态生成的问题。')}</div></div></section><section class="card"><div class="card-head"><div><h3>审批</h3><p>提交后自动生成审核任务。</p></div>${statusPill(d.approvalStatus==='approved'?'approved':d.approvalStatus==='in_review'?'in_review':'not_started')}</div><div class="card-body">${reviewTask?`<div class="artifact"><h4>${esc(reviewTask.title)}</h4><p>审核任务已进入“任务与审核”，两处状态实时一致。</p><button class="btn btn-sm" data-page="tasks">打开审核任务</button></div>`:`<button class="btn btn-primary btn-sm" data-action="submit-review" ${!canSubmit?'disabled':''}>提交审批</button>`}</div></section><section class="card"><div class="card-head"><div><h3>交付包</h3><p>审批通过后生成主视频、字幕和清单。</p></div>${statusPill(d.exportStatus==='ready'?'approved':'not_started')}</div><div class="card-body">${d.exportStatus==='ready'?`<div class="artifact selected"><h4>交付清单 V${d.reviewVersion?.timelineVersion||1}</h4><p>主视频 · 字幕文件 · 音频分轨 · 质检清单 · 资产授权清单</p><div class="artifact-actions"><button class="btn btn-sm" data-action="download-manifest">查看清单</button><button class="btn btn-sm" data-action="copy-share">复制分享说明</button></div></div>`:`<button class="btn btn-primary btn-sm" data-action="export-package" ${!canExport?'disabled':''}>导出交付包</button>`}</div></section></div>`)

    function enhanceA11y(root){
      if(!root)return;
      $$('.form-group',root).forEach(g=>{const control=$('input,textarea,select',g),label=$('label',g);if(control&&label){if(!control.id)control.id=`field-${++formSeq}`;label.htmlFor=control.id}});
      $$('[data-action][aria-pressed]',root).forEach(b=>b.setAttribute('aria-pressed',b.classList.contains('active')?'true':'false'));
      $$('.switch',root).forEach(b=>{b.setAttribute('role','switch');b.setAttribute('aria-checked',b.classList.contains('on')?'true':'false')});
    }
    function applyRoleVisibility(){
      $$('.nav-item').forEach(n=>{const allowed=canAccess(n.dataset.page);n.hidden=!allowed;const active=n.dataset.page===state.page;n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});
      $$('.nav-label').forEach(label=>{let next=label.nextElementSibling,any=false;while(next&&!next.classList.contains('nav-label')){if(next.classList.contains('nav-item')&&!next.hidden)any=true;next=next.nextElementSibling}label.hidden=!any});
      $('#roleSelect').value=state.role;$('#sidebarScope').textContent=`${ROLE_TEXT[state.role]}视图`;$('#sidebarFootText').textContent=state.role==='enterpriseAdmin'?'可查看企业级配置；数据仅保存在当前浏览器。':'仅显示当前角色可访问模块；前端视图不替代真实权限。';

      applyRoleVisibility();enhanceA11y($('#page'));
      if(focus){const h=$('#page h1');h?.focus({preventScroll:true})}
    }
    function go(page,{replace=false}={}){
      if(!renderers[page])page='projects';
      if(!canAccess(page)){toast('当前权限视图不可访问','请切换权限视图，或返回工作台。','warn');page='dashboard';replace=true}
      if(STAGE_KEYS.includes(page)&&!currentProject()){state.ui.pendingPage=page;openDrawer('project-gate',{nextPage:page});return}

      if(a==='generate-track'){const k=el.dataset.key;p.timeline.tracks[k]='running';render(false);setTimeout(()=>{p.timeline.tracks[k]='ready';p.timeline.dirty=true;persist(`AI生成${{narration:'旁白',music:'音乐',sfx:'音效',subtitles:'字幕'}[k]}`,true);render(false);toast('轨道成果已生成','已写入当前时间线','success')},560);return}
      if(a==='save-timeline'){if(!p.timeline.clips.length)return;p.timeline.savedVersion++;p.timeline.dirty=false;p.versions.push({stage:'edit',version:p.timeline.savedVersion,createdAt:now(),note:'保存时间线版本'});setStage(p,'edit','ready');persist('保存时间线版本');render(false);return}
      if(a==='render-review'){if(!p.timeline.savedVersion){toast('请先保存时间线版本','','warn');return}p.timeline.previewStatus='ready';p.delivery.reviewVersion={id:makeId('review'),label:`审核版 V${(p.delivery.reviewVersion?.sequence||0)+1}`,sequence:(p.delivery.reviewVersion?.sequence||0)+1,timelineVersion:p.timeline.savedVersion,createdAt:now()};p.delivery.qcStatus='not_started';p.delivery.issues=[];p.delivery.approvalStatus='none';setStage(p,'edit','locked');p.stageStatus.delivery='draft';persist('渲染审核版本',true);render(false);toast('审核版已生成','可进入审核与交付运行AI质检','success');return}
      if(a==='run-qc'){runJob(`qc:${p.id}`,'AI质量检测',()=>runQc(p));return}
      if(a==='fix-issue'){const issue=p.delivery.issues.find(x=>x.id===id);if(!issue)return;runJob(`fix:${id}`,'AI问题修复',()=>{issue.status='fixed';issue.updatedAt=now();if(['narration','music','sfx','subtitles'].includes(issue.target))p.timeline.tracks[issue.target]='ready';p.delivery.reviewVersion={...p.delivery.reviewVersion,id:makeId('review'),label:`审核版 V${(p.delivery.reviewVersion?.sequence||1)+1}`,sequence:(p.delivery.reviewVersion?.sequence||1)+1,createdAt:now()}});return}
      if(a==='submit-review'){const blockers=p.delivery.issues.filter(i=>i.severity==='blocking'&&i.status==='open').length;if(!p.delivery.reviewVersion||p.delivery.qcStatus!=='ready'||blockers){toast('尚不能提交审批','需完成质检并处理所有阻断问题','warn');return}const task={id:makeId('task'),kind:'review',title:`${p.name} · ${p.delivery.reviewVersion.label} 审核`,projectId:p.id,stageKey:'delivery',artifact:{type:'review-version',label:p.delivery.reviewVersion.label,version:p.delivery.reviewVersion.label},creator:'current-user',assignee:'current-user',priority:'high',status:'pending_review',createdAt:now(),updatedAt:now()};state.tasks.unshift(task);p.delivery.approvalStatus='in_review';p.status='review';p.stageStatus.delivery='in_review';persist('提交审核并创建任务');render(false);return}
      if(a==='review-approve'||a==='review-return'){const task=state.tasks.find(x=>x.id===id),pr=state.projects.find(x=>x.id===task?.projectId);if(!task||!pr)return;if(a==='review-approve'){task.status='approved';pr.delivery.approvalStatus='approved';pr.status='approved';pr.stageStatus.delivery='approved';persist('审核通过',true)}else{task.status='changes_requested';pr.delivery.approvalStatus='changes_requested';pr.status='active';pr.stageStatus.delivery='stale';persist('审核退回修改',true)}render(false);return}
      if(a==='open-task'){const task=state.tasks.find(x=>x.id===id);if(task?.projectId)state.currentProjectId=task.projectId;if(task?.stageKey)go(task.stageKey);else{toast('任务已打开',task?.title||'');render(false)}return}
      if(a==='export-package'){const blockers=p.delivery.issues.filter(i=>i.severity==='blocking'&&i.status==='open').length;if(p.delivery.approvalStatus!=='approved'||blockers){toast('交付条件未满足','','warn');return}p.delivery.exportStatus='ready';p.status='delivered';p.stageStatus.delivery='approved';persist('导出交付包');render(false);return}
      if(a==='download-manifest')toast('交付清单已就绪','正式系统可在此下载视频、字幕、分轨与清单');if(a==='copy-share'){navigator.clipboard?.writeText(`${p.name} · ${p.delivery.reviewVersion?.label||'交付版'}`);toast('分享说明已复制','','success')}
      if(a==='apply-template'){const t=state.templates.find(x=>x.id===id);if(!t)return;if(!p){openDrawer('project-from-template');$('#drawerTemplateId').value=t.id;return}if(!p.brief&&t.snapshot?.brief)p.brief=t.snapshot.brief;if(t.snapshot?.visual)p.visual={...p.visual,...Object.fromEntries(Object.entries(t.snapshot.visual).filter(([k])=>!p.visual[k]))};persist('套用模板到当前项目');render(false);return}
      if(a==='test-model'){const m=state.modelConnections.find(x=>x.id===id);if(!m)return;m.status=m.connectionType==='simulation'||m.endpoint?'connected':'failed';m.lastTestAt=now();m.failureReason=m.status==='failed'?'服务地址未填写':'';persist('测试模型连接',true);render(false);toast(m.status==='connected'?'连接测试通过':'连接测试失败',m.failureReason,m.status==='connected'?'success':'warn');return}
      if(a==='delete-asset'){state.assets=state.assets.filter(x=>x.id!==id);persist('移除资产记录',true);render(false);return}if(a==='remove-member'){state.members=state.members.filter(x=>x.id!==id);persist('移除成员记录',true);render(false);return}
      if(a==='save-budget'){persist('保存预算设置');render(false);return}if(a==='save-settings'){persist('保存系统设置');render(false);return}
      if(a==='toggle-setting'){const [x,y]=el.dataset.path.split('.');state.settings[x][y]=!state.settings[x][y];persist('更新系统策略',true);render(false);return}
      if(a==='export-data'||a==='export-audit')toast('导出已准备','正式系统可接入 CSV 或审计归档服务','success');
    }
    document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return}const panel=e.target.closest('[data-panel]');if(panel){openDrawer(panel.dataset.panel,{target:panel.dataset.target||'',stage:panel.dataset.stage||state.page});return}const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action,action)});
    document.addEventListener('input',e=>{const p=currentProject(),t=e.target;if(t.matches('[data-project-field]')&&p){const k=t.dataset.projectField;p[k]=t.value;p.updatedAt=now();if(p.plan.baselineLocked){p.plan.baselineLocked=false;p.stageStatus.plan='draft';markDownstreamStale(p,'plan')}markDirty()}else if(t.matches('[data-direction-field]')&&p){const d=p.plan.directions.find(x=>x.id===t.dataset.id);if(d){d[t.dataset.directionField]=t.value;d.humanEdited=true;markDirty()}}else if(t.matches('[data-scene-field]')&&p){const s=p.scenes.find(x=>x.id===t.dataset.id);if(s){s[t.dataset.sceneField]=t.value;s.locked=false;p.stageStatus.script='draft';markDownstreamStale(p,'script');markDirty()}}else if(t.matches('[data-shot-field]')&&p){const s=p.shots.find(x=>x.id===t.dataset.id);if(s){s[t.dataset.shotField]=t.value;s.locked=false;s.status='draft';p.stageStatus.script='draft';markDownstreamStale(p,'script');markDirty()}}else if(t.matches('[data-clip-field]')&&p){const c=p.timeline.clips.find(x=>x.id===t.dataset.id);if(c){c[t.dataset.clipField]=t.dataset.clipField==='duration'?Number(t.value):t.value;p.timeline.dirty=true;markDirty()}}else if(t.matches('[data-budget]')){state.budget[t.dataset.budget]=t.value;markDirty()}else if(t.matches('[data-setting]')){const [x,y]=t.dataset.setting.split('.');state.settings[x][y]=t.value;markDirty()}});
    document.addEventListener('change',e=>{const t=e.target;if(t.id==='roleSelect'||t.id==='inlineRoleSelect'){state.role=t.value;persist('切换权限视图',true);if(!canAccess(state.page))go('dashboard',{replace:true});else render(false);return}if(t.id==='assetScope'){if(t.value==='project'&&!currentProject()){openDrawer('project-gate',{nextPage:'assets'});return}state.ui.assetScope=t.value;render(false);return}if(t.id==='drawerAssetFiles'){state.ui.pendingFiles=[...t.files].map(f=>({name:f.name,type:f.type,size:f.size,lastModified:f.lastModified}));$('#assetFileCount').textContent=state.ui.pendingFiles.length?`已选择 ${state.ui.pendingFiles.length} 个文件`:'尚未选择文件';return}if(t.id==='drawerImportFile')$('#importFileCount').textContent=t.files.length?`${t.files[0].name} · ${Math.ceil(t.files[0].size/1024)} KB`:'尚未选择'});
    $('#drawerMask').addEventListener('click',closeDrawer);$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.contains('show')?closeSidebar():openSidebar());$('#sidebarClose').addEventListener('click',()=>closeSidebar());$('#sidebarMask').addEventListener('click',()=>closeSidebar());
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#drawer').classList.contains('show'))closeDrawer();else if($('#sidebar').classList.contains('show'))closeSidebar();return}if(e.key==='Tab'&&$('#drawer').classList.contains('show')){const focusables=$$('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])',$('#drawer')).filter(x=>x.offsetParent!==null);if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    addEventListener('resize',()=>{if(innerWidth>850)closeSidebar(false)});addEventListener('hashchange',handleHash);addEventListener('beforeunload',()=>persist('',true));
    $('#roleSelect').value=state.role;if(!location.hash)history.replaceState(null,'','#projects');handleHash();
  })();
  </script>
