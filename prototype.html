  <div class="app" id="appRoot">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand"><div class="brand-mark">V</div><div><b>VORO</b><small>AI视频制作工作台</small></div><button class="sidebar-close" id="sidebarClose" aria-label="关闭导航">✕</button></div>
      <nav class="nav" id="nav" aria-label="主导航">
        <div class="nav-label">工作台</div>
        <button class="nav-item" data-page="dashboard"><span class="nav-icon">⌂</span><span>工作台总览</span></button>
        <button class="nav-item active" data-page="projects"><span class="nav-icon">□</span><span>项目管理</span></button>
        <button class="nav-item" data-page="tasks"><span class="nav-icon">✓</span><span>任务与审核</span></button>
        <div class="nav-label" style="margin-top:14px">AI视频制作流程</div>
        <button class="nav-item" data-page="plan"><span class="nav-no">1</span><span>创意计划</span></button>
        <button class="nav-item" data-page="script"><span class="nav-no">2</span><span>剧本与分镜</span></button>
        <button class="nav-item" data-page="shots"><span class="nav-no">3</span><span>镜头生成</span></button>
        <button class="nav-item" data-page="edit"><span class="nav-no">4</span><span>剪辑与声音</span></button>
        <button class="nav-item" data-page="delivery"><span class="nav-no">5</span><span>审核与交付</span></button>
        <div class="nav-label" style="margin-top:14px">资源中心</div>
        <button class="nav-item" data-page="assets"><span class="nav-icon">▧</span><span>资产中心</span></button>
        <button class="nav-item" data-page="templates"><span class="nav-icon">▦</span><span>模板中心</span></button>
        <button class="nav-item role-admin" data-page="models"><span class="nav-icon">AI</span><span>模型能力与供应商</span></button>
        <div class="nav-label" style="margin-top:14px">企业管理</div>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">↗</span><span>数据分析</span></button>
        <button class="nav-item role-admin" data-page="cost"><span class="nav-icon">¥</span><span>成本与配额</span></button>
        <button class="nav-item role-admin" data-page="team"><span class="nav-icon">◎</span><span>团队与权限</span></button>
        <button class="nav-item role-admin" data-page="audit"><span class="nav-icon">≡</span><span>审计日志</span></button>
        <button class="nav-item role-admin" data-page="settings"><span class="nav-icon">⚙</span><span>系统设置</span></button>
      </nav>
      <div class="sidebar-foot"><b id="sidebarScope">企业管理员视图</b><span id="sidebarFootText">所有数据仅保存在当前浏览器，不含预置样例。</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="mobile-menu" id="mobileMenu" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false">☰</button>
          <div><div class="page-kicker">企业视频工作空间</div><div class="page-name" id="topPageName">项目管理</div></div>
        </div>
        <div class="top-actions">
          <span class="save-state saved" id="saveState" aria-live="polite">已保存到本机</span>
          <select class="role-select mode-select" id="generationModeSelect" aria-label="生成运行模式" title="切换演示回放或实时模型运行"><option value="replay">演示回放</option><option value="live">实时生成</option></select>
          <button class="btn btn-sm" data-action="toggle-presentation-mode" title="放大演示字号">演示字号</button>
          <select class="role-select" id="roleSelect" aria-label="预览权限视图"><option value="member">普通成员</option><option value="projectAdmin">项目管理员</option><option value="enterpriseAdmin" selected>企业管理员</option></select>
          <button class="project-select" data-action="go-projects"><i></i><b id="projectNameTop">未选择项目</b></button>
          <button class="btn btn-primary btn-sm" data-action="new-project">＋ 新建项目</button>
        </div>
      </header>
      <div class="content"><div class="page" id="page"></div></div>
    </main>
  </div>
  <div class="sidebar-mask" id="sidebarMask" aria-hidden="true"></div>

  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-describedby="drawerSubtitle" aria-hidden="true" tabindex="-1" hidden>
    <div class="drawer-head"><div><h2 id="drawerTitle">功能配置</h2><p id="drawerSubtitle">配置仅作用于当前项目</p></div><button class="drawer-close" data-action="close-drawer" aria-label="关闭">✕</button></div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot"><span style="color:var(--text-3);font-size:11px" id="drawerHint">所有设置均可再次修改</span><div class="drawer-foot-right"><button class="btn btn-ghost" data-action="close-drawer">取消</button><button class="btn btn-primary" id="drawerPrimary" data-action="save-panel">保存设置</button></div></div>
  </aside>
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <script type="application/x-voro-legacy">
    const STAGES=[
      {key:'plan',no:1,name:'创意计划',desc:'明确目标、输入、约束和生成计划'},
      {key:'script',no:2,name:'剧本与分镜',desc:'组织内容结构并拆解为可编辑镜头'},
      {key:'shots',no:3,name:'镜头生成',desc:'建立一致性规则并逐镜头生成'},
      {key:'edit',no:4,name:'剪辑与声音',desc:'完成时间线、旁白、音乐、音效和字幕'},
      {key:'delivery',no:5,name:'审核与交付',desc:'质量检查、审批、导出和发布'}
    ];
    const PAGE_NAMES={dashboard:'工作台总览',projects:'项目管理',tasks:'任务与审核',assets:'项目资产库',templates:'模板中心',models:'模型能力与供应商',analytics:'数据分析',cost:'成本与配额',team:'团队与权限',audit:'审计日志',settings:'系统设置'};
    const state={page:'projects',projectName:'',uploadCounts:{},drawerType:'',drawerStage:'',createdScenes:0,createdShots:0};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

    function stageStrip(){return `<div class="stage-strip">${STAGES.map(s=>`<button class="stage-chip ${state.page===s.key?'active':''}" data-page="${s.key}"><em>${s.no}</em><span>${s.name}</span></button>`).join('')}</div>`}
    function projectTools(){return `<div class="project-tools"><div class="project-tools-left"><span class="context-mark">AI</span><div class="context-copy"><b>${state.projectName?esc(state.projectName):'未选择项目'}</b><small>项目级上下文、锁定内容和版本关系持续生效</small></div></div><div class="tool-links"><button class="tool-link" data-panel="requirement">项目需求</button><button class="tool-link" data-panel="materials">素材库</button><button class="tool-link" data-panel="visual">全局视觉规则</button><button class="tool-link" data-panel="model">项目AI与预算</button><button class="tool-link" data-panel="history">版本历史</button></div></div>`}
    function stageHead(stage,actions=''){return `${projectTools()}${stageStrip()}<div class="page-head"><div><div class="page-title">${stage.no}. ${stage.name}</div><div class="page-desc">${stage.desc}。各成果物均可编辑、锁定版本，并针对局部内容继续调用AI。</div></div><div class="page-actions">${actions}<button class="btn btn-primary" data-panel="model" data-stage="${stage.key}">配置本阶段AI</button></div></div>`}
    function empty(icon,title,desc,buttons=''){return `<div class="empty"><div class="empty-icon">${icon}</div><b>${title}</b><p>${desc}</p>${buttons?`<div class="empty-actions">${buttons}</div>`:''}</div>`}
    function nextButton(key){const i=STAGES.findIndex(s=>s.key===key);if(i<0||i===STAGES.length-1)return '';return `<button class="btn" data-page="${STAGES[i+1].key}">下一阶段：${STAGES[i+1].name}</button>`}
    function enterpriseHead(title,desc,actions=''){return `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-desc">${desc}</div></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
    function metricCards(items){return `<div class="metric-row">${items.map(x=>`<div class="metric-card"><span>${x[0]}</span><b class="metric-empty">—</b><small>${x[1]}</small></div>`).join('')}</div>`}
    function emptyTable(columns,title,desc,buttons=''){return `<div class="table-shell"><table class="data-table"><thead><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody><tr class="data-table-empty"><td colspan="${columns.length}"><div class="table-empty"><b>${title}</b><p>${desc}</p>${buttons?`<div class="empty-actions">${buttons}</div>`:''}</div></td></tr></tbody></table></div>`}
    function pageTabs(items,active=0){return `<div class="page-tabs">${items.map((x,i)=>`<button class="${i===active?'active':''}" data-seg>${x}</button>`).join('')}</div>`}
    function moduleCard(icon,title,desc,action,panel){return `<div class="module-card"><div class="module-card-head"><div class="module-icon">${icon}</div><span class="capability-state">尚未配置</span></div><h3 style="margin-top:12px">${title}</h3><p>${desc}</p><button class="btn btn-sm" data-panel="${panel}">${action}</button></div>`}

    function projectsPage(){return `${enterpriseHead('项目管理','创建、导入、查找并管理企业视频项目；选择项目后进入五阶段AI制作流程。','<button class="btn" data-panel="import">导入项目需求</button><button class="btn btn-primary" data-action="new-project">＋ 创建空白项目</button>')}
      <div class="filterbar"><div class="filterbar-left"><input class="search-input" placeholder="搜索项目名称或标识"><select class="select" style="width:auto"><option>全部状态</option><option>制作中</option><option>待审核</option><option>已交付</option></select><select class="select" style="width:auto"><option>全部阶段</option>${STAGES.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="filterbar-right"><button class="btn btn-sm active" data-seg>列表</button><button class="btn btn-sm" data-seg>看板</button><button class="btn btn-sm" data-action="disabled-bulk">批量操作</button></div></div>
      ${emptyTable(['项目','当前阶段','负责人','输出规格','状态','更新时间','操作'],'暂无项目','创建空白项目或导入已有需求后，项目会显示在这里。','<button class="btn" data-panel="import">导入需求</button><button class="btn btn-primary" data-action="new-project">创建第一个项目</button>')}
      <section class="card" style="margin-top:14px"><div class="card-head"><div><h3>标准AI制作流程</h3><p>项目上下文、素材、模型路由、版本关系和审核状态贯穿全部阶段</p></div></div><div class="card-body"><div class="grid-3">${STAGES.map(s=>`<button class="rule-slot" style="text-align:left;color:inherit" data-page="${s.key}"><b>${s.no}. ${s.name}</b><span>${s.desc}</span><em style="color:var(--blue-2);font-style:normal;font-size:11px">查看功能 →</em></button>`).join('')}</div></div></section>`}

    function planPage(){const s=STAGES[0];return `${stageHead(s,nextButton('plan'))}<div class="grid-2">
      <section class="card"><div class="card-head"><div><h3>项目需求</h3><p>AI解析的唯一原始输入，可随时回溯</p></div><div class="card-actions"><button class="btn btn-xs" data-panel="adjust" data-target="项目需求">局部AI</button><button class="btn btn-xs btn-primary" data-action="ai-ready">AI解析需求</button></div></div><div class="card-body"><div class="form-group"><label class="form-label">原始制作需求 <span class="required">*</span></label><textarea class="textarea" id="briefInput" placeholder="填写视频主题、核心信息、目标受众、使用场景和必须包含的内容"></textarea></div><div class="form-grid" style="margin-top:12px"><div class="form-group"><label class="form-label">目标受众</label><input class="input" placeholder="填写目标受众"></div><div class="form-group"><label class="form-label">使用场景</label><input class="input" placeholder="填写投放或使用场景"></div><div class="form-group"><label class="form-label">内容语言</label><select class="select"><option value="" selected>请选择</option><option>中文</option><option>英文</option><option>多语言</option></select></div><div class="form-group"><label class="form-label">目标时长</label><input class="input" type="number" min="1" placeholder="填写秒数"></div></div></div></section>
      <section class="card"><div class="card-head"><div><h3>基础素材与事实依据</h3><p>上传前先分类，上传后再确认作用范围</p></div><button class="btn btn-xs" data-panel="materials">打开素材库</button></div><div class="card-body"><label class="upload"><input type="file" multiple data-file-input data-upload-scope="project-plan"><strong>拖拽或点击上传基础素材</strong><span>图片、视频、音频、文档和品牌规范</span><em class="upload-count" data-file-count>尚未选择文件</em></label><div class="form-grid" style="margin-top:12px"><div class="form-group"><label class="form-label">素材作用范围</label><select class="select"><option>整个项目</option><option>当前阶段</option><option>指定镜头</option></select></div><div class="form-group"><label class="form-label">版权与来源</label><select class="select"><option value="" selected>待确认</option><option>自有素材</option><option>已授权素材</option><option>公开可用素材</option></select></div></div></div></section>
      <section class="card"><div class="card-head"><div><h3>输出规格与约束</h3><p>规格将自动传递到镜头、时间线和交付</p></div><button class="btn btn-xs" data-panel="requirement">完整设置</button></div><div class="card-body"><div class="form-grid"><div class="form-group"><label class="form-label">主画幅</label><select class="select"><option value="" selected>请选择</option><option>横屏</option><option>竖屏</option><option>方形</option><option>自定义</option></select></div><div class="form-group"><label class="form-label">分辨率</label><select class="select"><option value="" selected>请选择</option><option>高清</option><option>超高清</option><option>自定义</option></select></div><div class="form-group full"><label class="form-label">必须遵守的约束</label><textarea class="textarea" placeholder="填写品牌、合规、版权、内容禁区和技术限制"></textarea></div></div></div></section>
      <section class="card"><div class="card-head"><div><h3>创意方向与风险</h3><p>生成多个可比较方向，选定后作为项目基线</p></div><div class="card-actions"><button class="btn btn-xs" data-panel="model">模型配置</button><button class="btn btn-xs btn-primary" data-action="ai-ready">生成创意方向</button></div></div><div class="card-body">${empty('AI','尚未生成创意方向','填写需求并配置AI后，可生成、比较、编辑和锁定多个创意方向。')}</div></section>
      <section class="card span-2"><div class="card-head"><div><h3>AI视频计划</h3><p>统一描述叙事结构、阶段产物、时长分配、素材需求、模型路由和成本上限</p></div><div class="card-actions"><button class="btn btn-xs" data-panel="adjust" data-target="视频计划">局部AI</button><button class="btn btn-xs btn-primary" data-action="ai-ready">生成视频计划</button></div></div><div class="card-body">${empty('▤','等待生成视频计划','确认需求与创意方向后，AI会输出可编辑的结构化计划，并标记缺失信息和高风险环节。')}</div></section>
    </div>`}

    function scriptPage(){const s=STAGES[1];return `${stageHead(s,nextButton('script'))}<div class="shot-toolbar" style="border:1px solid var(--line);border-radius:12px 12px 0 0"><div class="toolbar-group"><div class="seg"><button class="active" data-seg>剧本视图</button><button data-seg>场景视图</button><button data-seg>分镜视图</button></div><button class="btn btn-sm" data-action="add-scene">＋ 空白场景</button><button class="btn btn-sm" data-action="add-shot">＋ 空白镜头</button></div><div class="toolbar-group"><button class="btn btn-sm" data-panel="adjust" data-target="剧本与分镜">局部AI</button><button class="btn btn-primary btn-sm" data-action="ai-ready">从计划生成</button></div></div>
      <div class="workspace">
        <section class="workspace-col"><div class="workspace-title"><span>内容结构</span><button class="btn btn-xs" data-action="add-scene">＋</button></div><div class="workspace-body" id="sceneList"><div class="tree-empty"><b>暂无场景或镜头</b><span>手动创建空白结构，或由AI从视频计划生成。</span></div></div></section>
        <section class="workspace-col"><div class="workspace-title"><span>内容编辑区</span><div class="seg"><button class="active" data-seg>画面</button><button data-seg>旁白</button><button data-seg>屏幕文字</button></div></div><div class="workspace-body">${empty('▦','选择一个场景或镜头','在左侧选择内容后，可直接编辑画面描述、旁白、字幕、时长、景别、机位和运镜。','<button class="btn btn-sm" data-action="add-shot">创建空白镜头</button>')}</div></section>
        <aside class="workspace-col inspector"><div class="workspace-title"><span>镜头检查器</span><button class="btn btn-xs" data-panel="model">AI设置</button></div><div class="workspace-body"><div class="form-group"><label class="form-label">镜头名称</label><input class="input" placeholder="选择镜头后编辑"></div><div class="form-group"><label class="form-label">画面描述</label><textarea class="textarea" placeholder="选择镜头后编辑"></textarea></div><div class="form-grid"><div class="form-group"><label class="form-label">时长</label><input class="input" placeholder="未设置"></div><div class="form-group"><label class="form-label">景别</label><select class="select"><option>未设置</option></select></div><div class="form-group"><label class="form-label">机位</label><select class="select"><option>未设置</option></select></div><div class="form-group"><label class="form-label">运镜</label><select class="select"><option>未设置</option></select></div></div><div class="form-group" style="margin-top:12px"><label class="form-label">验收标准</label><textarea class="textarea" placeholder="填写本镜头通过条件"></textarea></div></div></aside>
      </div>
      <section class="card" style="margin-top:14px"><div class="card-head"><div><h3>脚本覆盖与时长检查</h3><p>自动检查信息覆盖、节奏、重复内容、旁白密度和目标时长</p></div><button class="btn btn-sm" data-action="ai-ready">运行AI检查</button></div><div class="card-body"><div class="mini-kpi"><div><b>内容覆盖</b><span>尚未检查</span></div><div><b>目标时长</b><span>尚未计算</span></div><div><b>待确认项</b><span>尚未识别</span></div></div></div></section>`}

    function shotsPage(){const s=STAGES[2];return `${stageHead(s,nextButton('shots'))}<section class="card"><div class="card-head"><div><h3>全局视觉与一致性规则</h3><p>主体、环境、风格和负面约束由所有镜头继承，也可逐镜头覆盖</p></div><div class="card-actions"><button class="btn btn-xs" data-panel="visual">详细设置</button><button class="btn btn-xs" data-panel="model">模型路由</button></div></div><div class="card-body"><div class="rules"><div class="rule-slot"><b>主体一致性</b><span>尚未配置主体参考、身份特征和锁定项</span><button class="btn btn-xs" data-panel="visual">配置</button></div><div class="rule-slot"><b>环境一致性</b><span>尚未配置场景、时间、天气和空间关系</span><button class="btn btn-xs" data-panel="visual">配置</button></div><div class="rule-slot"><b>风格与摄影</b><span>尚未配置影调、镜头语言、质感和构图</span><button class="btn btn-xs" data-panel="visual">配置</button></div><div class="rule-slot"><b>负面约束</b><span>尚未配置禁止元素、失真类型和安全规则</span><button class="btn btn-xs" data-panel="visual">配置</button></div></div></div></section>
      <section class="card" style="margin-top:14px"><div class="shot-toolbar"><div class="toolbar-group"><select class="filter"><option>全部镜头</option><option>待生成</option><option>待确认</option><option>已锁定</option></select><select class="filter"><option>全部模型路由</option><option>未配置模型</option></select></div><div class="toolbar-group"><button class="btn btn-sm" data-action="add-shot">＋ 空白镜头</button><button class="btn btn-sm" data-panel="materials">批量绑定素材</button><button class="btn btn-primary btn-sm" data-action="ai-ready">批量生成</button></div></div><div class="card-body" id="shotBoard">${empty('◇','暂无待生成镜头','从剧本与分镜同步镜头，或手动创建空白镜头。每个镜头可独立生成关键帧、首尾帧、视频候选和局部修复。','<button class="btn btn-sm" data-action="add-shot">创建空白镜头</button><button class="btn btn-primary btn-sm" data-action="ai-ready">从分镜同步</button>')}</div></section>

    function settingsPage(){return `${enterpriseHead('系统设置','管理工作空间默认值、安全与合规、存储、通知、品牌、发布和数据使用策略。','<button class="btn" data-action="reset-empty">恢复未保存更改</button><button class="btn btn-primary" data-action="save-settings">保存设置</button>')}

        <section class="card"><div class="card-head"><div><h3>工作空间</h3><p>企业基础信息与本地化设置</p></div></div><div class="card-body"><div class="form-grid"><div class="form-group full"><label class="form-label">工作空间名称</label><input class="input" data-setting="workspace.name" value="${esc(s.workspace.name)}" placeholder="未配置"></div><div class="form-group"><label class="form-label">语言</label><select class="select" data-setting="workspace.language"><option value="zh-CN" ${s.workspace.language==='zh-CN'?'selected':''}>简体中文</option><option value="en-US" ${s.workspace.language==='en-US'?'selected':''}>English</option></select></div><div class="form-group"><label class="form-label">时区</label><input class="input" data-setting="workspace.timezone" value="${esc(s.workspace.timezone)}"></div></div></div></section>

        <section class="card"><div class="card-head"><div><h3>通知</h3><p>审核、失败和配额预警的通知方式</p></div></div><div class="card-body"><div class="form-grid"><div class="form-group"><label class="form-label">通知渠道</label><select class="select" data-setting="notifications.channel"><option value="" ${!s.notifications.channel?'selected':''}>未配置</option><option value="email" ${s.notifications.channel==='email'?'selected':''}>邮件</option><option value="webhook" ${s.notifications.channel==='webhook'?'selected':''}>Webhook</option><option value="in-app" ${s.notifications.channel==='in-app'?'selected':''}>站内通知</option></select></div><div class="form-group"><label class="form-label">接收人或地址</label><input class="input" data-setting="notifications.recipient" value="${esc(s.notifications.recipient)}" placeholder="未配置"></div></div><div class="card-note" style="margin-top:10px">建议至少通知：生成失败、审核待办、配额预警和交付完成。</div></div></section>
        <section class="card"><div class="card-head"><div><h3>品牌</h3><p>品牌名称、公开域名和水印策略</p></div></div><div class="card-body"><div class="form-grid"><div class="form-group"><label class="form-label">品牌名称</label><input class="input" data-setting="brand.name" value="${esc(s.brand.name)}" placeholder="未配置"></div><div class="form-group"><label class="form-label">公开域名</label><input class="input" data-setting="brand.domain" value="${esc(s.brand.domain)}" placeholder="未配置"></div></div>${switchRow('brand.watermark','默认添加水印','应用于新生成的预览与审核版本。')}</div></section>

    function drawerShell(title,subtitle,body,primary='保存设置',hint='所有设置均可再次修改'){$('#drawerTitle').textContent=title;$('#drawerSubtitle').textContent=subtitle;$('#drawerBody').innerHTML=body;$('#drawerPrimary').textContent=primary;$('#drawerPrimary').dataset.action=primary==='关闭'?'close-drawer':state.drawerType==='new-project'?'create-project':'save-panel';$('#drawerHint').textContent=hint;$('#drawer').classList.add('show');$('#drawerMask').classList.add('show');$('#drawer').setAttribute('aria-hidden','false');syncFileCounts()}
    function openDrawer(type,stage='',target=''){state.drawerType=type;state.drawerStage=stage||state.page;let body='';
      if(type==='new-project'){body=`<div class="drawer-section"><h3>项目基本信息</h3><p>只创建空白项目，不带入任何样例数据。</p><div class="form-group"><label class="form-label">项目名称</label><input class="input" id="newProjectName" placeholder="填写项目名称"></div><div class="form-group" style="margin-top:12px"><label class="form-label">原始需求</label><textarea class="textarea" id="newProjectBrief" placeholder="可先留空，进入创意计划后再完善"></textarea></div></div><div class="drawer-section"><h3>初始输出规格</h3><p>后续可在项目需求中修改。</p><div class="form-grid"><div class="form-group"><label class="form-label">目标时长</label><input class="input" type="number" min="1" placeholder="填写秒数"></div><div class="form-group"><label class="form-label">主画幅</label><select class="select"><option value="" selected>请选择</option><option>横屏</option><option>竖屏</option><option>方形</option><option>自定义</option></select></div></div></div>`;return drawerShell('创建空白项目','创建后进入创意计划',''+body,'创建并进入','不会自动生成或填充内容');}
      if(type==='import'){body=`<div class="drawer-section"><h3>导入需求资料</h3><p>支持原始文本、文档、表格、图片、视频和音频。</p><label class="upload"><input type="file" multiple data-file-input data-upload-scope="project-import"><strong>拖拽或点击选择文件</strong><span>文件先进入暂存区，确认后才由AI解析</span><em class="upload-count" data-file-count>尚未选择文件</em></label></div><div class="drawer-section"><h3>解析范围</h3><p>选择希望AI从资料中提取的内容。</p><div class="check-row"><label><input type="checkbox" checked>目标、受众与使用场景</label></div><div class="check-row"><label><input type="checkbox" checked>必须出现的内容与事实依据</label></div><div class="check-row"><label><input type="checkbox" checked>规格、限制、风险和待补信息</label></div></div>`;return drawerShell('导入项目需求','导入后仍由用户确认结构化结果',body,'开始解析');}
      if(type==='requirement'){body=`<div class="drawer-section"><h3>项目级需求</h3><p>这里的设置会传递到所有阶段。</p><div class="form-group"><label class="form-label">项目目标</label><textarea class="textarea" placeholder="填写视频要解决的问题和期望结果"></textarea></div><div class="form-grid" style="margin-top:12px"><div class="form-group"><label class="form-label">目标时长</label><input class="input" placeholder="未设置"></div><div class="form-group"><label class="form-label">主画幅</label><select class="select"><option>未设置</option></select></div><div class="form-group"><label class="form-label">语言</label><select class="select"><option>未设置</option></select></div><div class="form-group"><label class="form-label">输出规格</label><select class="select"><option>未设置</option></select></div></div></div><div class="drawer-section"><h3>继承与变更</h3><p>修改项目级设置前显示受影响的阶段和成果物。</p><div class="setting-row"><label>变更前显示影响范围<small>避免覆盖已锁定内容</small></label><button class="switch on" data-switch></button></div><div class="setting-row"><label>保留人工编辑与锁定版本<small>AI重生成时优先保护</small></label><button class="switch on" data-switch></button></div></div>`;return drawerShell('项目需求','项目级设置',body);}

"><div class="card-head"><div><h3>三套AI创意方向</h3><p>只有点击“生成三套创意方案”后才会出现；每套都能编辑和局部AI优化。</p></div>${p.plan.directions.length?`<span>${p.plan.directions.length} 个候选</span>`:''}</div><div class="card-body">${dirs||emptyState(p.analysis?'等待生成创意方案':'等待AI解析需求',p.analysis?'点击顶部“生成三套创意方案”。':'先保存需求并完成AI解析。')}</div></section></div><aside class="stack"><section class="card"><div class="card-head"><h3>当前计划基线</h3></div><div class="card-body">${p.plan.selected?`<div class="artifact selected"><div class="artifact-head"><h4>${esc(p.plan.directions.find(d=>d.id===p.plan.selected)?.title||'已选候选')}</h4>${statusPill(locked?'locked':'ready')}</div><p>版本 V${p.plan.version||1} · ${locked?'下游可引用':'等待锁定'}</p>${locked?'':'<button class="btn btn-primary btn-sm" data-action="lock-plan">设为计划基线并锁定</button>'}</div>`:emptyState('尚未采用候选','从左侧三套方案中选择一个。')}</div></section><section class="card"><div class="card-head"><h3>输出与轨道要求</h3></div><div class="card-body">${['narration:旁白','music:音乐','sfx:音效','subtitles:字幕'].map(x=>{const [k,n]=x.split(':');return `<div class="setting-row"><div><b>${n}</b><small>纳入成片检查与交付清单</small></div><button class="switch ${p.requiredTracks[k]?'on':''}" role="switch" aria-checked="${p.requiredTracks[k]}" aria-label="是否需要${n}" data-action="toggle-track" data-key="${k}" ${locked?'disabled':''}></button></div>`}).join('')}</div></section></aside></div>`)

    function shotsPage(){
      const p=currentProject();if(!p)return `${pageHead('镜头生成','先选择项目。')}${emptyState('尚未选择项目','选择项目后再生成镜头。','<button class="btn btn-primary" data-page="projects">选择项目</button>')}`;
      const ready=p.stageStatus.script==='locked',allLocked=p.shots.length>0&&p.shots.every(s=>s.locked),keyframeCount=p.shots.filter(s=>(s.candidates||[]).some(c=>c.mediaType==='image')).length,videoCount=p.shots.filter(s=>(s.candidates||[]).some(c=>c.mediaType==='video')).length;
      const cards=p.shots.map((s,i)=>{const cands=s.candidates||[],adopted=cands.find(c=>c.id===s.adoptedCandidateId),preview=adopted||cands.at(-1),hasKeyframe=cands.some(c=>c.mediaType==='image');const frame=preview?.poster||preview?.src;return `<article class="shot-card ${state.ui.selectedShotId===s.id?'selected':''}"><button class="shot-frame ${frame?'has-media':''}" data-action="select-shot" data-id="${s.id}" style="width:100%;border-left:0;border-right:0;border-top:0">${frame?`<img class="generated-media" src="${esc(resolveMediaPath(frame))}" alt="${esc(s.name)}生成预览"><span>${esc(preview.type)} · V${preview.version}</span>`:'等待生成关键帧'}</button><div class="shot-card-body"><div class="artifact-head"><div><h3>S${String(i+1).padStart(2,'0')} · ${esc(s.name)}</h3><p>${esc(s.duration||'未设')}秒 · ${esc(s.visual||'缺少画面描述')}</p></div>${statusPill(s.locked?'locked':cands.length?'ready':'draft')}</div><div class="artifact-actions"><button class="btn btn-xs" data-action="generate-candidate" data-type="keyframe" data-id="${s.id}" ${!ready||!s.visual||s.locked?'disabled':''}>${hasKeyframe?'再生成关键帧':'生成关键帧'}</button><button class="btn btn-xs" data-action="generate-candidate" data-type="video" data-id="${s.id}" ${!ready||!s.visual||s.locked||(p.liveDemo?.enabled&&!hasKeyframe)?'disabled':''}>生成视频</button><button class="btn btn-xs" data-action="local-redo" data-id="${s.id}" ${!cands.length||s.locked?'disabled':''}>AI局部重做</button></div>${cands.length?`<div style="display:grid;gap:7px;margin-top:10px">${cands.map(c=>`<div class="candidate ${c.id===s.adoptedCandidateId?'adopted':''}"><div class="candidate-media">${c.poster?`<img src="${esc(resolveMediaPath(c.poster))}" alt="${esc(c.type)}预览">`:''}<div><div class="artifact-head"><b>${esc(c.type)} · V${c.version}</b>${c.id===s.adoptedCandidateId?statusPill('ready'):statusPill(c.status)}</div><p>${esc(c.prompt)}</p><div class="artifact-actions"><button class="btn btn-xs" data-action="preview-candidate" data-shot="${s.id}" data-id="${c.id     function resolvedRoute(capability,stageKey=null){const p=currentProject();return state.routes.find(r=>r.enabled&&r.scope==='stage'&&r.projectId===p?.id&&r.stageKey===stageKey&&r.capability===capability)||state.routes.find(r=>r.enabled&&r.scope==='project'&&r.projectId===p?.id&&r.capability===capability)||state.routes.find(r=>r.enabled&&r.scope==='org'&&r.capability===capability)||null}
    function modelsPage(){

      const caps=Object.keys(CAP_TEXT).map(c=>{const connected=state.modelConnections.filter(m=>m.status==='connected'&&m.capabilities.includes(c)),simulated=state.modelConnections.filter(m=>m.status==='simulation'&&m.capabilities.includes(c)),route=resolvedRoute(c,state.page);return `<div class="capability-card"><b>${CAP_TEXT[c]}</b><p>${connected.length?`真实服务 ${connected.length} 个`:simulated.length?`演示模拟 ${simulated.length} 个`:'尚未接入可用服务'}<br>当前路由：${route?esc(route.strategy):'未配置真实路由'}</p><span class="capability-state">${connected.length?'可实时调用':simulated.length?'仅演示':'待配置'}</span><div style="margin-top:9px"><button class="btn btn-xs" data-panel="new-route" data-target="${c}">配置路由</button></div></div>`}).join('');
      const p=currentProject(),mode=p?.generation?.mode||'replay';
      return `${scopeBar()}${pageHead('模型能力与供应商','统一管理模型连接、能力覆盖和组织/项目/阶段三级路由；不会保存真实密钥。','<button class="btn btn-primary" data-panel="connect-model">＋ 接入模型服务</button>')}<div class="mode-disclosure ${mode==='live'?'live':''}"><b>当前项目：${mode==='live'?'实时生成':'演示回放'}</b> · ${mode==='live'?(p?.generation?.providerReady?'真实服务已通过连接测试。':'尚无真实服务通过连接测试，生成任务会被阻断。'):'使用已归档成果，不产生实时调用和费用。'}</div><div class="card"><div class="card-head"><div><h3>能力覆盖</h3><p>阶段路由优先于项目路由，项目路由优先于企业默认。</p></div></div><div class="card-body"><div class="capability-grid">${caps}</div></div></div><div class="table-shell" style="margin-top:14px"><table class="data-table"><thead><tr><th>连接</th><th>能力</th><th>状态</th><th>最近测试</th><th>操作</th></tr></thead><tbody>${connections||tableEmpty('尚未接入模型服务','可创建原型模拟连接，或登记公有云、私有部署和自定义API。','<button class="btn btn-primary" data-panel="connect-model">接入模型服务</button>')}</tbody></table></div>`
    }

    function enhanceA11y(root){

    }
    function applyRoleVisibility(){

      $('#roleSelect').value=state.role;const mode=$('#generationModeSelect'),p=currentProject();if(mode){mode.value=p?.generation?.mode||'replay';mode.disabled=!p}$('#sidebarScope').textContent=`${ROLE_TEXT[state.role]}视图`;$('#sidebarFootText').textContent=state.role==='enterpriseAdmin'?'可查看企业级配置；数据仅保存在当前浏览器。':'仅显示当前角色可访问模块；前端视图不替代真实权限。';
    }

    function stageGate(p,page){
      if(!p||!STAGE_KEYS.includes(page))return {ok:true};

        shots:{ok:p.stageStatus.script==='locked',back:'script',message:'请先生成并确认完整脚本与分镜'},
        edit:{ok:p.stageStatus.shots==='locked',back:'shots',message:'请先生成关键帧和视频候选，并锁定全部镜头'},
        delivery:{ok:!!p.delivery.reviewVersion&&!!p.finalMedia,back:'edit',message:'请先完成时间线、声音、字幕并渲染审核成片'}
      };
